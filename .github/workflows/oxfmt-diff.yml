name: oxfmt diff (temporary)

# Temporary, manually dispatched helper for the release formatter blocker:
# format the two files flagged by the formatter check on the exact upstream
# source the Android queue is based on, then upload the diff as an artifact.
# Read-only, no push triggers, no native build; removed after the artifact is
# collected.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxfmt-diff:
    name: Format flagged files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean upstream and apply Android patch queue
        shell: bash
        run: bash android/scripts/prepare-clean-upstream.sh
      - uses: ./.github/actions/bun-install
      # The repository's pinned formatter, never a fresh download.
      - name: Format flagged files
        shell: bash
        run: |
          ./node_modules/.bin/oxfmt \
            packages/coding-agent/test/interactive-click-focus.test.ts \
            packages/tui/src/tui.ts
      - name: Capture diff
        shell: bash
        run: |
          git diff -- \
            packages/coding-agent/test/interactive-click-focus.test.ts \
            packages/tui/src/tui.ts > "$RUNNER_TEMP/oxfmt.patch"
          test -s "$RUNNER_TEMP/oxfmt.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: oxfmt-patch
          path: ${{ runner.temp }}/oxfmt.patch
          if-no-files-found: error
