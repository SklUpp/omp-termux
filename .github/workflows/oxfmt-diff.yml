name: oxfmt diff (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxfmt-diff:
    name: Format flagged files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean upstream and apply Android patch queue
        shell: bash
        run: bash android/scripts/prepare-clean-upstream.sh
      - uses: ./.github/actions/bun-install
      - name: Format flagged files
        shell: bash
        run: |
          ./node_modules/.bin/oxfmt \
            packages/coding-agent/src/cli/worktree-cli.ts \
            packages/coding-agent/src/task/isolation-ownership.ts \
            packages/coding-agent/src/task/isolation-runner.ts \
            packages/coding-agent/src/task/persisted-revive.ts \
            packages/coding-agent/src/task/worktree.ts \
            packages/coding-agent/test/task/isolation-retained.test.ts \
            packages/coding-agent/test/task/persisted-revive.test.ts \
            packages/coding-agent/test/task/task-spawn.test.ts \
            packages/coding-agent/test/task/task-schema.test.ts \
            packages/coding-agent/test/task/result-summary.test.ts
      - name: Capture diff
        shell: bash
        run: |
          git diff -- packages/ > "$RUNNER_TEMP/oxfmt.patch"
          test -s "$RUNNER_TEMP/oxfmt.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: oxfmt-patch
          path: ${{ runner.temp }}/oxfmt.patch
          if-no-files-found: error
