name: Rust agent

# Builds the standalone Rust `omp` binary and runs its tests entirely with
# rustup + cargo. Bun/Node are deliberately absent: the point of this workflow
# is proving the Rust runtime has no Bun/Node dependency at build or run time.
on:
  push:
    branches: [main, feat/rust-agent-termux-bionic]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rust-agent-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-host:
    name: Host tests (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: ./.github/actions/ensure-rust-toolchain
        with:
          toolchain: nightly-2026-08-08
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-agent-host
      - name: Diagnose Julia availability probe
        timeout-minutes: 2
        run: |
          set +e
          julia=/usr/bin/julia
          echo "--- interpreter ---"
          command -v julia
          ls -l "$julia"
          readlink -f "$julia" || true
          start=$(date +%s%N)
          version_out=$(timeout 15 "$julia" --version 2>&1)
          version_status=$?
          end=$(date +%s%N)
          echo "version: status=$version_status elapsed_ms=$(( (end - start) / 1000000 )) output=$version_out"
          python3 - "$julia" <<'PY'
          import os, re, subprocess, sys, time

          julia = sys.argv[1]

          # Mirror crates/pi-agent/src/eval/env.rs: COMMON_ALLOW + JL_ALLOW,
          # JL prefixes, SHARED_DENY, then SECRET_PATTERN. Values are never
          # printed; only names of the filtered JULIA_/XDG_ keys.
          common_allow = {
              "PATH", "HOME", "USER", "USERNAME", "LOGNAME", "SHELL", "LANG",
              "LC_ALL", "LC_CTYPE", "LC_MESSAGES", "TERM", "TERM_PROGRAM",
              "TERM_PROGRAM_VERSION", "TMPDIR", "TEMP", "TMP", "XDG_CACHE_HOME",
              "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_RUNTIME_DIR",
              "SSH_AUTH_SOCK", "SSH_AGENT_PID", "SSH_CONNECTION", "SSH_CLIENT",
              "SSH_TTY", "LD_LIBRARY_PATH", "DYLD_LIBRARY_PATH", "TZ",
              "SYSTEMROOT", "WINDIR", "COMSPEC", "PATHEXT",
          }
          allow = common_allow | {"DISPLAY", "XAUTHORITY"}
          prefixes = ("LC_", "XDG_", "PI_", "JULIA_", "OPENBLAS_", "MKL_")
          deny = {
              "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GOOGLE_API_KEY",
              "GEMINI_API_KEY", "OPENROUTER_API_KEY", "PERPLEXITY_API_KEY",
              "PERPLEXITY_COOKIES", "EXA_API_KEY", "AZURE_OPENAI_API_KEY",
              "MISTRAL_API_KEY", "PI_API_KEY", "PI_TOKEN", "PI_PASSWORD",
              "PI_SESSION", "PI_TOOL_BRIDGE_TOKEN",
          }
          secret = re.compile(
              r"(?i)API[_-]?KEY|APIKEY|SECRET|TOKEN|PASSWORD|PASSWD|CREDENTIAL|ACCESS[_-]?KEY|PRIVATE[_-]?KEY"
          )

          def filter_env(env):
              filtered = {}
              for key, value in env.items():
                  if key in deny:
                      continue
                  if key == "PATH" or key in allow:
                      filtered[key] = value
                      continue
                  if secret.search(key):
                      continue
                  if key.startswith(prefixes):
                      filtered[key] = value
              return filtered

          filtered = filter_env(os.environ)

          def run(label, argv, env):
              started = time.monotonic()
              try:
                  proc = subprocess.run(
                      argv,
                      env=env,
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=15,
                      start_new_session=True,
                  )
                  status = proc.returncode
              except subprocess.TimeoutExpired:
                  status = "timeout"
              except OSError as error:
                  status = f"spawn-error: {error.errno}"
              elapsed = int((time.monotonic() - started) * 1000)
              print(f"{label}: status={status} elapsed_ms={elapsed}")

          run("bare", [julia, "-e", "exit(0)"], dict(os.environ))
          run(
              "flags",
              [julia, "--startup-file=no", "--history-file=no", "--color=no", "-e", "exit(0)"],
              dict(os.environ),
          )
          run("filtered", [julia, "-e", "exit(0)"], filtered)
          names = sorted(key for key in filtered if key.startswith(("JULIA_", "XDG_")))
          present = [key for key in ("LD_LIBRARY_PATH", "HOME", "PATH") if key in filtered]
          print("filtered JULIA_/XDG_ names:", ",".join(names) if names else "(none)")
          print("filtered core presence:", ",".join(present))
          print("filtered env count:", len(filtered))
          PY
      - name: Check agent workspace members
        run: cargo check --locked -p pi-agent -p omp-cli
      - name: Test agent core and CLI
        run: cargo test --locked -p pi-agent -p omp-cli

  test-native-grep:
    name: Native grep and matcher tests (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: ./.github/actions/ensure-rust-toolchain
        with:
          toolchain: nightly-2026-08-08
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-agent-native-grep
      - name: Test grep pattern matcher
        run: cargo test --locked -p pi-grep-pattern
      - name: Test native grep
        run: cargo test --locked -p pi-natives grep

  build-android:
    name: Android arm64 binary (bionic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Load Android manifest environment
        run: grep -v '^#' android/versions.env >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain with Android target
        uses: ./.github/actions/ensure-rust-toolchain
        with:
          toolchain: nightly-2026-08-08
          target: aarch64-linux-android
      - name: Install NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-agent-android
      - name: Build omp for aarch64-linux-android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          API="${ANDROID_API:-24}"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android${API}-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$AR_aarch64_linux_android"
          # ring and other cc-rs consumers read the unprefixed target vars.
          export TARGET_CC="$CC_aarch64_linux_android"
          export TARGET_AR="$AR_aarch64_linux_android"
          export RUSTFLAGS="-C opt-level=3 -C debuginfo=0 -C strip=symbols -C link-arg=-fuse-ld=lld"
          cargo build --release --locked -p omp-cli --target aarch64-linux-android
          BIN="target/aarch64-linux-android/release/omp"
          "$TOOLCHAIN/llvm-strip" "$BIN"
          file -b "$BIN" | tee /dev/stderr | grep -q 'ELF 64-bit.*aarch64'
          ls -lh "$BIN"
          sha256sum "$BIN" > "$BIN.sha256"
      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: omp-aarch64-linux-android
          path: |
            target/aarch64-linux-android/release/omp
            target/aarch64-linux-android/release/omp.sha256
          if-no-files-found: error
