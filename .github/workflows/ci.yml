name: Repository checks

on:
  push:
    branches: [main, verified-release-9690622, termux-18.0.11-release]
    paths-ignore:
      - .github/VOUCHED.td
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      patch-profile:
        description: "Patch profile (standard excludes patch 02)"
        required: false
        type: string
        default: extended

# Keep PR feedback current; never cancel main pushes or manual runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OMP_PATCH_PROFILE: ${{ inputs.patch-profile || 'extended' }}

permissions:
  contents: read

jobs:
  quality-check:
    name: Type check and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Type check workspace
        run: bun run ci:check:full
      - name: Build collab web
        run: bun run collab:web:build

  android-overlay-check:
    name: Android overlay validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare clean upstream and apply Android patch queue
        shell: bash
        run: bash android/scripts/prepare-clean-upstream.sh
      - name: Validate Android overlay
        run: python3 android/scripts/verify-overlay.py
      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py
      - uses: ./.github/actions/bun-install
      # Lightweight synthetic installer regression: stubbed curl/pkg/uname with
      # real tar/sha256sum, no network and no native build. Runs before the
      # heavy addon build so installer breakage fails fast.
      - name: Verify installer end to end (synthetic)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash android/scripts/test-install.sh
      - name: Verify patch profiles and release tags
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash android/scripts/test-patch-profiles.sh
      - name: Build host native addon for applied tests
        run: bun --cwd=packages/natives run build
      # Reuses the addon build's cargo profile ("local"); these are the pure
      # naming/private-dir unit tests that the addon build alone never runs.
      - name: Run IPC endpoint and relocation-directory unit tests
        run: cargo test --profile local -p pi-natives --lib ipc::
      - name: Run native IPC integration tests
        run: bun test ./packages/natives/test/ipc.test.ts
      - name: Type check applied patch queue
        run: bun run ci:check:full
      - name: Build applied collab web
        run: bun run collab:web:build
      - name: Run applied overlay tests
        run: |
          tests=()
          for t in \
            ./packages/coding-agent/test/android-helpers.test.ts \
            ./packages/coding-agent/test/generator-android.test.ts \
            ./packages/coding-agent/test/repo-root-isolation.test.ts \
            ./packages/coding-agent/test/custom-controller-termux.test.ts \
            ./packages/coding-agent/test/custom-service-termux.test.ts \
            ./packages/coding-agent/test/custom-service-extended.test.ts \
            ./packages/coding-agent/test/custom-service-approval-idempotent.test.ts \
            ./packages/coding-agent/test/focused-recovery-identity-verifier.test.ts \
            ./packages/coding-agent/test/grouped-fixes-regression.test.ts \
            ./packages/coding-agent/test/learn-commands-registry.test.ts \
            ./packages/coding-agent/test/p1-cleanup-state-machine.test.ts \
            ./packages/coding-agent/test/race-foreign-regression.test.ts \
            ./packages/coding-agent/test/final-projection-recovery.test.ts \
            ./packages/coding-agent/test/mnemopi-idempotent-exact-bank.test.ts \
            ./packages/mnemopi/test/beam-idempotency-concurrent.test.ts \
            ./packages/mnemopi/test/beam-p1-keyed-reuse-collision.test.ts \
            ./packages/mnemopi/test/beam-p1-gist-rekey-consolidation.test.ts; do
            [[ -f "$t" ]] && tests+=("$t")
          done
          bun test "${tests[@]}"
      # Required, not optional coverage: first-party Android browser discovery
      # (real probe fixture, forced android platform) and the update refusal,
      # so a missing/renamed file fails instead of silently greening.
      - name: Run Android browser, update, notification, and clipboard tests
        run: |
          bun test \
            ./packages/coding-agent/test/tools/browser-android-chromium.test.ts \
            ./packages/coding-agent/test/cli/update-cli.test.ts \
            ./packages/coding-agent/test/termux-notifications.test.ts \
            ./packages/coding-agent/test/utils/clipboard.test.ts \
            ./packages/coding-agent/test/utils/clipboard-osc52.test.ts \
            ./packages/coding-agent/test/slash-commands/copy.test.ts
      # Required: the Android memory-hint widening must keep its fallible
      # procfs/cgroup reads — MemAvailable when available, physical RAM only
      # when /proc/meminfo itself is unreadable, cgroup limits when readable.
      - name: Run Android sort memory-hint tests
        run: cargo test --profile local -p pi-builtins --lib sort::
      # Required, not optional coverage: these exercise the retained-workspace
      # lifecycle, dynamic-schema repoRoot, resume-hint, and explicit cold
      # release contracts added by patch 02, so a missing/renamed file must fail the job instead of
      # silently greening the overlay check.
      - name: Run isolation lifecycle tests
        if: env.OMP_PATCH_PROFILE == 'extended'
        shell: bash
        run: |
          bun test \
            ./packages/coding-agent/test/task/isolation-retained.test.ts \
            ./packages/coding-agent/test/task/persisted-revive.test.ts \
            ./packages/coding-agent/test/task/task-spawn.test.ts \
            ./packages/coding-agent/test/task/task-schema.test.ts \
            ./packages/coding-agent/test/task/result-summary.test.ts \
            ./packages/coding-agent/test/cli/worktree-release-isolation.test.ts
