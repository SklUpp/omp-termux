name: Repository checks

on:
  push:
    branches: [main, verified-release-9690622, termux-18.0.11-release]
    paths-ignore:
      - .github/VOUCHED.td
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      patch-profile:
        description: "Patch profile (standard excludes 9x fork features)"
        required: false
        type: string
        default: extended

# Keep PR feedback current; never cancel main pushes or manual runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OMP_PATCH_PROFILE: ${{ inputs.patch-profile || 'extended' }}

permissions:
  contents: read

jobs:
  quality-check:
    name: Type check and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Type check workspace
        run: bun run ci:check:full
      - name: Build collab web
        run: bun run collab:web:build

  android-overlay-check:
    name: Android overlay validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare clean upstream and apply Android patch queue
        shell: bash
        run: bash android/scripts/prepare-clean-upstream.sh
      - name: Validate Android overlay
        run: python3 android/scripts/verify-overlay.py
      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py
      - uses: ./.github/actions/bun-install
      # Lightweight synthetic installer regression: stubbed curl/pkg/uname with
      # real tar/sha256sum, no network and no native build. Runs before the
      # heavy addon build so installer breakage fails fast.
      - name: Verify installer end to end (synthetic)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash android/scripts/test-install.sh
      - name: Verify patch profiles and release tags
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash android/scripts/test-patch-profiles.sh
      - name: Build host native addon for applied tests
        run: bun --cwd=packages/natives run build
      # Reuses the addon build's cargo profile ("local"); these are the pure
      # naming/private-dir unit tests that the addon build alone never runs.
      - name: Run IPC endpoint and relocation-directory unit tests
        shell: bash
        run: |
          pkg=omp-natives
          [ -f crates/natives/Cargo.toml ] || pkg=pi-natives
          cargo test --profile local -p "$pkg" --lib 'ipc::'
      - name: Run native IPC integration tests
        run: bun test ./packages/natives/test/ipc.test.ts
      - name: Type check applied patch queue
        run: bun run ci:check:full
      - name: Build applied collab web
        run: bun run collab:web:build
      - name: Run applied overlay tests
        run: |
          tests=()
          for t in \
            ./packages/coding-agent/test/android-helpers.test.ts \
            ./packages/coding-agent/test/generator-android.test.ts \
            ./packages/coding-agent/test/repo-root-isolation.test.ts \
            ./packages/coding-agent/test/custom-controller-termux.test.ts \
            ./packages/coding-agent/test/custom-service-termux.test.ts \
            ./packages/coding-agent/test/custom-service-extended.test.ts \
            ./packages/coding-agent/test/custom-service-approval-idempotent.test.ts \
            ./packages/coding-agent/test/focused-recovery-identity-verifier.test.ts \
            ./packages/coding-agent/test/grouped-fixes-regression.test.ts \
            ./packages/coding-agent/test/learn-commands-registry.test.ts \
            ./packages/coding-agent/test/p1-cleanup-state-machine.test.ts \
            ./packages/coding-agent/test/race-foreign-regression.test.ts \
            ./packages/coding-agent/test/final-projection-recovery.test.ts \
            ./packages/coding-agent/test/mnemopi-idempotent-exact-bank.test.ts \
            ./packages/mnemopi/test/beam-idempotency-concurrent.test.ts \
            ./packages/mnemopi/test/beam-p1-keyed-reuse-collision.test.ts \
            ./packages/mnemopi/test/beam-p1-gist-rekey-consolidation.test.ts; do
            [[ -f "$t" ]] && tests+=("$t")
          done
          bun test "${tests[@]}"
      # Required, not optional coverage: first-party Android browser discovery
      # (real probe fixture, forced android platform) and the update refusal,
      # so a missing/renamed file fails instead of silently greening.
      - name: Run Android browser, update, notification, and clipboard tests
        run: |
          bun test \
            ./packages/coding-agent/test/tools/browser-android-chromium.test.ts \
            ./packages/coding-agent/test/cli/update-cli.test.ts \
            ./packages/coding-agent/test/termux-notifications.test.ts \
            ./packages/coding-agent/test/utils/clipboard.test.ts \
            ./packages/coding-agent/test/utils/clipboard-osc52.test.ts \
            ./packages/coding-agent/test/slash-commands/copy.test.ts
      # Required: the Android memory-hint widening must keep its fallible
      # procfs/cgroup reads — MemAvailable when available, physical RAM only
      # when /proc/meminfo itself is unreadable, cgroup limits when readable.
      - name: Run Android sort memory-hint tests
        shell: bash
        run: |
          pkg=omp-builtins
          [ -f crates/builtins/Cargo.toml ] || pkg=pi-builtins
          cargo test --profile local -p "$pkg" --lib 'sort::'
      # Required, not optional coverage: these exercise the retained-workspace
      # lifecycle, dynamic-schema repoRoot, resume-hint, and explicit cold
      # release contracts added by patch 90, so a missing/renamed file must fail the job instead of
      # silently greening the overlay check.
      - name: Run isolation lifecycle tests
        if: env.OMP_PATCH_PROFILE == 'extended'
        shell: bash
        run: |
          bun test \
            ./packages/coding-agent/test/task/deferred-integration.test.ts \
            ./packages/coding-agent/test/task/isolation-retained.test.ts \
            ./packages/coding-agent/test/task/persisted-revive.test.ts \
            ./packages/coding-agent/test/task/task-spawn.test.ts \
            ./packages/coding-agent/test/task/task-schema.test.ts \
            ./packages/coding-agent/test/task/result-summary.test.ts \
            ./packages/coding-agent/test/cli/worktree-release-isolation.test.ts

  # Artifact-only build, dispatchable from the default branch because GitHub
  # requires the workflow file there. Runs only when ci.yml is manually
  # dispatched on the refresh branch; preflights reuse this file's own
  # quality-check/android-overlay-check jobs (never re-enter ci.yml), build the
  # extended (01..04+90) profile and upload a release-identical bundle. No tags or
  # releases are created and nothing is published.
  profile-compat:
    name: Patch profile compatibility (${{ matrix.profile }})
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
      github.ref == 'refs/heads/refresh/termux-upstream-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, extended]
    env:
      OMP_PATCH_PROFILE: ${{ matrix.profile }}
      OMP_RELEASE_VARIANT: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean upstream and apply Android patch queue
        shell: bash
        run: bash android/scripts/prepare-clean-upstream.sh
      - name: Verify Android overlay and profile
        run: python3 android/scripts/verify-overlay.py
      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py
      - name: Verify applied patch set matches profile
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OMP_PATCH_PROFILE" = standard ]; then
            test ! -e packages/coding-agent/test/task/isolation-retained.test.ts
            ! git apply --reverse --check --whitespace=nowarn android/patches/90-isolation-retained.patch 2>/dev/null
          else
            test -s packages/coding-agent/test/task/isolation-retained.test.ts
            git apply --reverse --check --whitespace=nowarn android/patches/90-isolation-retained.patch
          fi
          echo "profile ${OMP_PATCH_PROFILE} tree matches its manifest"

  native-addon-build:
    name: Android arm64 native addon
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
      github.ref == 'refs/heads/refresh/termux-upstream-20261117'
    needs: [quality-check, android-overlay-check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_PATCH_PROFILE: extended
      OMP_RELEASE_VARIANT: extended
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean upstream and apply Android patch queue
        shell: bash
        run: bash android/scripts/prepare-clean-upstream.sh

      - name: Load Android manifest environment
        run: |
          set -euo pipefail
          grep -v '^#' android/versions.env >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 300 sudo apt-get update -qq
          timeout 300 sudo apt-get install -y ninja-build cmake python3 unzip

      - name: Verify Android overlay and release tag
        run: python3 android/scripts/verify-overlay.py

      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py

      - name: Verify browser prerequisite metadata (no bundle)
        run: |
          set -euo pipefail
          # Pinned Termux:X11 chromium 149.0.7827.155 — metadata only, no binary bundled
          grep -q '149.0.7827.155' android/scripts/verify-browser.sh
          grep -q '36500e23ad23bf2616bb4f215a297ba5a2b9e625992362b9b9c6bd05e0a27272' android/scripts/verify-browser.sh
          grep -q 'packages.termux.dev/apt/termux-x11' android/scripts/verify-browser.sh
          grep -q '\$PREFIX/lib/chromium/chrome' android/scripts/verify-browser.sh
          bash -n android/scripts/verify-browser.sh
          bash -n android/scripts/smoke-browser.sh
          bash android/scripts/verify-browser.sh --help >/dev/null
          bash android/scripts/smoke-browser.sh --help >/dev/null
          # Ensure release docs reference same pin
          grep -q '149.0.7827.155' android/docs/verification.md
          grep -q '36500e23ad23bf2616bb4f215a297ba5a2b9e625992362b9b9c6bd05e0a27272' android/docs/verification.md
          echo "browser metadata OK — external Termux:X11, not bundled"

      - name: Install Rust target
        run: |
          set -euo pipefail
          source android/versions.env
          rustup toolchain install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-linux-android

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Make CMake find Ninja
        run: |
          set -euo pipefail
          ninja=$(command -v ninja || command -v ninja-build)
          cmake_bin=$(command -v cmake)
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/cmake" <<EOF
          #!/bin/sh
          if [ "\$1" = "--build" ]; then
            exec "$cmake_bin" "\$@"
          fi
          args=""
          for arg in "\$@"; do
            case "\$arg" in
              -DCMAKE_SYSTEM_PROCESSOR=*) continue ;;
            esac
            args="\$args \"\$arg\""
          done
          eval exec "$cmake_bin" \$args -DCMAKE_MAKE_PROGRAM="$ninja" -DCMAKE_POLICY_DEFAULT_CMP0057=NEW
          EOF
          chmod +x "$RUNNER_TEMP/bin/cmake"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_BOOTSTRAP_VERSION }}

      - name: Install JS dependencies
        run: bun install --minimum-release-age 0
      - name: Cross-compile native addon
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_BUILD_JOBS: 4
          RAYON_NUM_THREADS: 4
          MAKEFLAGS: "-j4"
          NUM_JOBS: 4
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          NINJAFLAGS: "-j4"
          OPUS_NO_PKG_CONFIG: "1"
          CMAKE_GENERATOR: Ninja
          CARGO_INCREMENTAL: "false"
          CARGO_TERM_COLOR: always
          CMAKE_C_COMPILER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CMAKE_CXX_COMPILER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          CMAKE_AR: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CMAKE_RANLIB: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          TARGET_CC: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          TARGET_CXX: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          TARGET_AR: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          TARGET_RANLIB: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: bash android/scripts/build-android-ci.sh

      - name: Build Android compatibility library (close_range seccomp fallback)
        run: |
          set -euo pipefail
          ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang \
            -shared -fPIC -O2 -ldl -o packages/natives/native/libomp-compat.so android/compat/libomp-compat.c
          test -s packages/natives/native/libomp-compat.so

      - name: Verify native addon artifact naming and checksum
        run: |
          set -euo pipefail
          test -s packages/natives/native/pi_natives.android-arm64.node
          test -s packages/natives/native/pi_natives.android-arm64.node.sha256
          (cd packages/natives/native && sha256sum -c pi_natives.android-arm64.node.sha256)
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          addon = Path("packages/natives/native/pi_natives.android-arm64.node")
          pkg = json.loads(Path("packages/natives/package.json").read_text(encoding="utf-8"))
          version = pkg["version"]
          magic = b"PI_NATIVES_VERSION_STAMP:"
          expected = magic + version.encode("utf-8") + b"\x00"
          data = addon.read_bytes()
          if magic in data and expected not in data:
              sys.exit(f"error: {addon} is unstamped or mismatched for {version}")
          print(f"Native addon version stamp verified: {version}")
          PY

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-native
          path: |
            packages/natives/native/pi_natives.android-arm64.node
            packages/natives/native/pi_natives.android-arm64.node.sha256
            packages/natives/native/libomp-compat.so
          if-no-files-found: error

  js-bundle-build:
    name: Termux JS bundle
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
      github.ref == 'refs/heads/refresh/termux-upstream-20261117'
    needs: [quality-check, android-overlay-check]
    runs-on: ubuntu-latest
    env:
      OMP_PATCH_PROFILE: extended
      OMP_RELEASE_VARIANT: extended
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean upstream and apply Android patch queue
        shell: bash
        run: bash android/scripts/prepare-clean-upstream.sh

      - name: Load Android manifest environment
        run: |
          set -euo pipefail
          grep -v '^#' android/versions.env >> "$GITHUB_ENV"

      - name: Verify Android overlay and release tag
        run: python3 android/scripts/verify-overlay.py

      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py

      - name: Verify browser prerequisite metadata (no bundle)
        run: |
          set -euo pipefail
          grep -q '149.0.7827.155' android/scripts/verify-browser.sh
          grep -q '36500e23ad23bf2616bb4f215a297ba5a2b9e625992362b9b9c6bd05e0a27272' android/scripts/verify-browser.sh
          bash -n android/scripts/verify-browser.sh
          bash -n android/scripts/smoke-browser.sh
          bash android/scripts/verify-browser.sh --help >/dev/null
          # Bundle does not yet exist — metadata check only
          echo "browser metadata OK"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_BOOTSTRAP_VERSION }}

      - name: Install JS dependencies
        run: bun install --minimum-release-age 0

      - name: Build JavaScript bundle
        run: |
          set -euo pipefail
          # Lean path: no host linux-x64 natives, no stats vite pipeline.
          # Full arm64 package still embeds docs + natives loader stubs.
          bun android/scripts/build-termux-js.ts
          test -s termux-js.tar.gz

      - name: Verify JavaScript bundle archive contents
        run: |
          set -euo pipefail
          test -s termux-js.tar.gz
          tar -tzf termux-js.tar.gz | grep -Fx './cli.js'
          tar -tzf termux-js.tar.gz | grep -F 'node_modules/@oh-my-pi/pi-natives/package.json'
          tar -tzf termux-js.tar.gz | grep -F 'node_modules/@oh-my-pi/pi-natives/native/index.js'
          # Browser bundle-absence gate (JS bundle stage)
          ! tar -tzf termux-js.tar.gz | grep -qi chromium
          ! tar -tzf termux-js.tar.gz | grep -q './chrome'

      - name: Upload JavaScript bundle
        uses: actions/upload-artifact@v4
        with:
          name: termux-js-bundle
          path: termux-js.tar.gz
          if-no-files-found: error

  assemble-artifact:
    name: Assemble branch artifact
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
      github.ref == 'refs/heads/refresh/termux-upstream-20261117'
    needs: [profile-compat, native-addon-build, js-bundle-build]
    runs-on: ubuntu-latest
    env:
      OMP_PATCH_PROFILE: extended
      OMP_RELEASE_VARIANT: extended
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load Android manifest environment
        run: |
          set -euo pipefail
          grep -v '^#' android/versions.env >> "$GITHUB_ENV"
      - name: Prepare clean upstream and apply Android patch queue
        shell: bash
        run: bash android/scripts/prepare-clean-upstream.sh

      - name: Verify Android overlay and release tag
        run: python3 android/scripts/verify-overlay.py

      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py

      - name: Verify browser prerequisite metadata (no bundle)
        run: |
          set -euo pipefail
          grep -q '149.0.7827.155' android/scripts/verify-browser.sh
          grep -q '36500e23ad23bf2616bb4f215a297ba5a2b9e625992362b9b9c6bd05e0a27272' android/scripts/verify-browser.sh
          grep -q 'packages.termux.dev/apt/termux-x11' android/scripts/verify-browser.sh
          bash -n android/scripts/verify-browser.sh
          bash -n android/scripts/smoke-browser.sh
          bash android/scripts/verify-browser.sh --help >/dev/null
          bash android/scripts/smoke-browser.sh --help >/dev/null
          echo "browser metadata OK"

      - name: Download native addon
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-native
          path: packages/natives/native

      - name: Download JavaScript bundle
        uses: actions/download-artifact@v4
        with:
          name: termux-js-bundle
          path: .

      - name: Download official stable Bun
        run: |
          set -euo pipefail
          source android/versions.env
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${BUN_ARCHIVE_NAME}" \
            -o /tmp/bun.zip
          printf '%s  %s\n' "$BUN_SHA256" /tmp/bun.zip | sha256sum -c -
          rm -rf /tmp/bun-extract
          mkdir /tmp/bun-extract
          unzip -q /tmp/bun.zip -d /tmp/bun-extract
          BUN_BIN=$(find /tmp/bun-extract -type f -name bun -print -quit)
          test -n "$BUN_BIN"
          test -x "$BUN_BIN"
          file "$BUN_BIN" | grep -q 'aarch64'
          cp "$BUN_BIN" /tmp/bun-extract/bun
          chmod 755 /tmp/bun-extract/bun

      - name: Assemble and test release bundle
        run: |
          set -euo pipefail
          source android/versions.env
          test -s packages/natives/native/pi_natives.android-arm64.node
          test -s packages/natives/native/pi_natives.android-arm64.node.sha256
          (cd packages/natives/native && sha256sum -c pi_natives.android-arm64.node.sha256)
          test -s termux-js.tar.gz
          tar -tzf termux-js.tar.gz | grep -Fx './cli.js'
          rm -rf termux-bundle
          mkdir termux-bundle
          tar -xzf termux-js.tar.gz -C termux-bundle
          mkdir -p termux-bundle/node_modules/@oh-my-pi/pi-natives/native
          cp packages/natives/native/pi_natives.android-arm64.node \
            termux-bundle/node_modules/@oh-my-pi/pi-natives/native/
          cp packages/natives/native/libomp-compat.so termux-bundle/libomp-compat.so
          chmod 755 termux-bundle/libomp-compat.so
          test -s termux-bundle/cli.js
          test -s termux-bundle/node_modules/@oh-my-pi/pi-natives/native/pi_natives.android-arm64.node
          test -s termux-bundle/libomp-compat.so

          # Verify native addon version stamp in assembled bundle
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          addon = Path("termux-bundle/node_modules/@oh-my-pi/pi-natives/native/pi_natives.android-arm64.node")
          pkg = json.loads(Path("termux-bundle/node_modules/@oh-my-pi/pi-natives/package.json").read_text(encoding="utf-8"))
          version = pkg["version"]
          magic = b"PI_NATIVES_VERSION_STAMP:"
          expected = magic + version.encode("utf-8") + b"\x00"
          data = addon.read_bytes()
          if magic in data and expected not in data:
              sys.exit(f"error: {addon} is unstamped or mismatched for {version}")
          print(f"Bundle native addon version stamp verified: {version}")
          PY

          # Android ARM64 Bun cannot execute on x86_64 GitHub runners; URL,
          # manifest version, SHA256, and ELF architecture verify asset identity.
          test -x /tmp/bun-extract/bun
          cp /tmp/bun-extract/bun termux-bundle/bun
          chmod +x termux-bundle/bun
          test -x termux-bundle/bun

          tar -czf omp-termux.tar.gz -C termux-bundle .
          sha256sum omp-termux.tar.gz > omp-termux.tar.gz.sha256
          test -s omp-termux.tar.gz
          test -s omp-termux.tar.gz.sha256
          sha256sum -c omp-termux.tar.gz.sha256
          tar -tzf omp-termux.tar.gz | grep -Fx './cli.js'
          tar -tzf omp-termux.tar.gz | grep -Fx './bun'
          tar -tzf omp-termux.tar.gz | grep -Fx './libomp-compat.so'
          tar -tzf omp-termux.tar.gz | grep -F './node_modules/@oh-my-pi/pi-natives/native/pi_natives.android-arm64.node'
          (cd packages/natives/native && sha256sum -c pi_natives.android-arm64.node.sha256)

          # Browser bundle-absence gate — Chromium must NOT be in OMP bundle (external apt only)
          echo "checking OMP bundle does not contain Chromium"
          ! tar -tzf omp-termux.tar.gz | grep -qi chromium
          ! tar -tzf omp-termux.tar.gz | grep -q './chrome'
          ! tar -tzf omp-termux.tar.gz | grep -q 'headless_shell'
          bash android/scripts/verify-browser.sh --check-bundle ./omp-termux.tar.gz
          bash -n android/scripts/verify-browser.sh
          bash -n android/scripts/smoke-browser.sh
          bash android/scripts/verify-browser.sh --help >/dev/null
          bash android/scripts/smoke-browser.sh --help >/dev/null
          bash android/scripts/verify-browser.sh --help | grep -q '149.0.7827.155'
          echo "browser bundle-absence OK"

      - name: Report checksums
        run: |
          set -euo pipefail
          cat omp-termux.tar.gz.sha256
          cat packages/natives/native/pi_natives.android-arm64.node.sha256
          {
            echo "### Termux branch artifact"
            echo
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- upstream pin: \`$(tr -d '[:space:]' < android/UPSTREAM_COMMIT)\`"
            echo "- profile: \`${OMP_PATCH_PROFILE}\`"
            echo
            echo '```'
            cat omp-termux.tar.gz.sha256
            cat packages/natives/native/pi_natives.android-arm64.node.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Termux artifact
        uses: actions/upload-artifact@v4
        with:
          name: omp-termux-extended-branch
          path: |
            omp-termux.tar.gz
            omp-termux.tar.gz.sha256
            packages/natives/native/pi_natives.android-arm64.node
            packages/natives/native/pi_natives.android-arm64.node.sha256
            android/scripts/verify-browser.sh
            android/scripts/smoke-browser.sh
          if-no-files-found: error
