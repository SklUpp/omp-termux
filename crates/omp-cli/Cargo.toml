[package]
name = "omp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "omp_cli"
path = "src/lib.rs"

[[bin]]
name = "omp"
path = "src/main.rs"

[dependencies]
# No YAML crate: config.yml/models.yml are read by the in-tree subset parser in
# `src/yaml.rs` so the binary keeps a small, offline-buildable dependency set and
# avoids the archived `serde_yaml`.
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
globset.workspace = true
grep-searcher.workspace = true
libc.workspace = true
pi-agent = { path = "../pi-agent" }
pi-grep-pattern = { path = "../pi-grep-pattern" }
pi-walker.workspace = true
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Pinned: the lock already resolves sha2 0.10.9 and 0.11.0; auth parity uses 0.10.
sha2 = "0.10.9"
rusqlite = { version = "0.33.0", features = ["bundled"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "fs", "io-util", "sync", "macros"] }
tokio-util.workspace = true
# Same crate and version the native lock names its abstract socket with.
xxhash-rust.workspace = true

[dev-dependencies]
clap.workspace = true
tokio = { workspace = true, features = ["full"] }
